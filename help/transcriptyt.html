<!DOCTYPE html>
<html lang="en" data-theme="normal">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YouTube Transcript Tool</title>
<script>
  (function () {
    try {
      var savedTheme = localStorage.getItem('theme');
      if (savedTheme) {
        document.documentElement.setAttribute('data-theme', savedTheme);
      }
    } catch (e) {}
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  @font-face {
    font-family: 'Minecraft Bold';
    src: url('../webfiles/MinecraftBold-nMK1.otf') format('opentype');
    font-display: swap;
  }

  @font-face {
    font-family: 'Minecraft';
    src: url('../webfiles/MinecraftRegular-Bmg3.otf') format('opentype');
    font-display: swap;
  }

  :root {
    --bg: #FF960C;
    --title: #FF7100;
    --text: #F7F7F7;
    --line: #2E1A00;
    --card-bg: #3d2402;
    --shadow: 0 2px 10px rgba(46, 26, 0, 0.18);
    --shadow-hover: 0 10px 28px rgba(46, 26, 0, 0.4);
  }

  html[data-theme="dark"] {
    --bg: #121212;
    --title: #1e1e1e;
    --text: #f0f0f0;
    --line: #000000;
    --card-bg: #1a1a1a;
    --shadow: 0 2px 10px rgba(255, 255, 255, 0.18);
    --shadow-hover: 0 10px 28px rgba(255, 255, 255, 0.4);
  }

  html[data-theme="light"] {
    --bg: #f5f5f5;
    --title: #ffffff;
    --text: #222222;
    --line: #cfcfcf;
    --card-bg: #ffffff;
    --shadow: 0 2px 10px rgba(46, 26, 0, 0.18);
    --shadow-hover: 0 10px 28px rgba(46, 26, 0, 0.4);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Minecraft', 'IBM Plex Mono', monospace;
    transition: background 0.2s ease, color 0.2s ease;
  }

  html {
    scrollbar-width: thin;
    scrollbar-color: var(--line) var(--bg);
  }

  ::-webkit-scrollbar { width: 12px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb {
    background: var(--line);
    border-radius: 8px;
    border: 3px solid var(--bg);
  }
  ::-webkit-scrollbar-thumb:hover { background: var(--title); }

  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 72px 24px 48px;
  }

  main {
    width: 100%;
    max-width: 700px;
  }

  .nav-back {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 28px;
    text-decoration: none;
    color: var(--text);
    font-size: 0.85rem;
    border: 1px solid var(--line);
    padding: 9px 16px;
    border-radius: 5px;
    background: var(--title);
    transition: background 0.15s ease, padding-left 0.15s ease;
  }

  .nav-back:hover {
    background: #E06800;
    padding-left: 20px;
  }

  .folder {
    position: relative;
    border: 1px solid var(--line);
    border-radius: 5px;
    box-shadow: var(--shadow);
    transition: box-shadow 0.2s ease;
  }

  .folder:hover,
  .folder:focus-within {
    box-shadow: var(--shadow-hover);
  }

  .folder-head {
    padding: 18px 22px;
    border-bottom: 1px solid var(--line);
    background: var(--title);
    border-radius: 5px 5px 0 0;
  }

  .folder-head h1 {
    font-family: 'Minecraft Bold', 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 1.4rem;
    color: var(--text);
    margin: 0 0 6px;
    letter-spacing: -0.01em;
  }

  .folder-head p {
    margin: 0;
    color: var(--text);
    font-size: 0.85rem;
    opacity: 0.85;
    line-height: 1.5;
  }

  .folder-body {
    padding: 22px;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }

  .search-row {
    display: flex;
    gap: 10px;
  }

  input[type="text"] {
    flex: 1;
    padding: 12px 14px;
    font-size: 0.9rem;
    font-family: 'IBM Plex Mono', monospace;
    border: 1px solid var(--line);
    border-radius: 5px;
    background: var(--text);
    color: #222;
  }

  .btn {
    padding: 12px 18px;
    font-size: 0.85rem;
    font-family: 'Minecraft', 'IBM Plex Mono', monospace;
    background: var(--title);
    color: var(--text);
    border: 1px solid var(--line);
    border-radius: 5px;
    cursor: pointer;
    font-weight: bold;
    white-space: nowrap;
    transition: background 0.15s ease;
  }

  .btn:hover { background: #E06800; }
  .btn:active { transform: translate(1px, 1px); }

  .action-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .action-row h2 {
    margin: 0;
    font-size: 0.95rem;
    color: var(--text);
    font-family: 'Minecraft', 'IBM Plex Mono', monospace;
  }

  .copy-btn {
    padding: 8px 14px;
    font-size: 0.78rem;
    background: rgba(0, 0, 0, 0.15);
    color: var(--text);
    border: 1px solid var(--line);
    border-radius: 5px;
    cursor: pointer;
    font-weight: bold;
  }

  .copy-btn:hover { background: rgba(0, 0, 0, 0.25); }

  #output {
    white-space: pre-wrap;
    background: var(--card-bg);
    padding: 18px;
    border-radius: 5px;
    border: 1px solid var(--line);
    min-height: 140px;
    line-height: 1.6;
    font-size: 0.88rem;
    color: var(--text);
  }

  .saved-section {
    margin-top: 24px;
  }

  .saved-heading {
    margin-bottom: 12px;
  }

  .saved-heading h2 {
    margin: 0;
    font-size: 0.95rem;
    color: var(--text);
    font-family: 'Minecraft', 'IBM Plex Mono', monospace;
  }

  .saved-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 14px;
  }

  .mini-card {
    flex: 1 1 calc(50% - 7px);
    min-width: 220px;
    border: 1px solid var(--line);
    border-radius: 5px;
    background: var(--title);
    box-shadow: var(--shadow);
    padding: 14px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .mini-card .mini-title {
    font-weight: bold;
    font-size: 0.85rem;
    color: var(--text);
  }

  .mini-card .mini-preview {
    font-size: 0.75rem;
    color: var(--text);
    opacity: 0.8;
    line-height: 1.45;
  }

  .mini-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 2px;
  }

  .mini-btn {
    font-size: 0.7rem;
    padding: 6px 9px;
    border-radius: 4px;
    border: 1px solid var(--line);
    background: rgba(0, 0, 0, 0.15);
    color: var(--text);
    cursor: pointer;
    font-family: 'Minecraft', 'IBM Plex Mono', monospace;
  }

  .mini-btn:hover { background: rgba(0, 0, 0, 0.28); }
  .mini-btn.danger:hover { background: #b02a2a; }

  .add-card {
    flex: 1 1 calc(50% - 7px);
    min-width: 220px;
    border: 2px dashed var(--line);
    border-radius: 5px;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 90px;
    cursor: pointer;
    font-size: 1.8rem;
    color: var(--text);
    opacity: 0.65;
    background: transparent;
    font-family: 'Minecraft', 'IBM Plex Mono', monospace;
    transition: opacity 0.15s ease, background 0.15s ease;
  }

  .add-card:hover {
    opacity: 1;
    background: rgba(0, 0, 0, 0.08);
  }

  @media (max-width: 480px) {
    body { padding: 48px 16px 40px; }
    .search-row { flex-direction: column; }
  }
</style>
</head>
<body>

<main>
  <a href="../index.html" class="nav-back">← Back to Directory</a>

  <section class="folder">
    <div class="folder-head">
      <h1>YouTube Transcript Tool</h1>
      <p>Extract video text tracks cleanly using your free Supadata account.</p>
    </div>

    <div class="folder-body">
      <div class="search-row">
        <input type="text" id="videoUrl" placeholder="Paste YouTube link here (e.g., https://youtu.be/...)">
        <button class="btn" onclick="getTranscript()">Fetch Text</button>
      </div>

      <div class="action-row">
        <h2>Transcript Output</h2>
        <button class="copy-btn" onclick="copyToClipboard()">📋 Copy Text</button>
      </div>

      <div id="output">Your transcript will appear here...</div>
    </div>
  </section>

  <section class="saved-section">
    <div class="saved-heading">
      <h2>Saved Transcripts</h2>
    </div>
    <div class="saved-grid" id="savedGrid"></div>
  </section>
</main>

<script>
  // Your integrated Supadata API Key
  const MY_SUPADATA_KEY = "sd_131232fbc0989acf458c7606ff1a9ee6";

  function copyToClipboard() {
    const outputText = document.getElementById('output').innerText;
    if (outputText === "Your transcript will appear here..." || outputText.trim() === "" || outputText.startsWith("Error:")) {
      alert("There is no valid transcript text to copy yet!");
      return;
    }
    navigator.clipboard.writeText(outputText).then(() => {
      alert("Transcript copied to clipboard successfully!");
    }).catch(() => {
      alert("Oops, unable to copy text automatically.");
    });
  }

  function cleanSoundTags(text) {
    if (!text) return "";
    // Strips bracketed/parenthesized sound cues like [music] or (laughter)
    let clean = text.replace(/\[.*?\]|\(.*?\)/gi, "");
    return clean.replace(/\s+/g, " ").trim();
  }

  async function getTranscript() {
    const urlInput = document.getElementById('videoUrl').value.trim();
    const outputDiv = document.getElementById('output');

    if (!urlInput) {
      alert('Please paste a YouTube URL first.');
      return;
    }

    outputDiv.innerText = "Connecting to Supadata and processing captions...";

    // Correct endpoint: https://api.supadata.ai/v1/transcript?url=<encoded url>&text=true
    const targetUrl = "https://api.supadata.ai/v1/transcript?url=" + encodeURIComponent(urlInput) + "&text=true";

    try {
      const response = await fetch(targetUrl, {
        method: 'GET',
        headers: {
          'x-api-key': MY_SUPADATA_KEY
        }
      });

      if (!response.ok) {
        const errBody = await response.text().catch(() => "");
        throw new Error("Unable to grab transcript (status " + response.status + "). Verify the URL, your API key, or your free credit limit. " + errBody);
      }

      const data = await response.json();
      let rawTranscript = "";

      if (data.content && typeof data.content === 'string') {
        rawTranscript = data.content;
      } else if (Array.isArray(data.content)) {
        rawTranscript = data.content.map(function (item) { return item.text; }).join(' ');
      } else if (data.transcript) {
        rawTranscript = data.transcript;
      } else {
        outputDiv.innerText = "No readable text track found inside this video's payload.";
        return;
      }

      outputDiv.innerText = cleanSoundTags(rawTranscript);
    } catch (error) {
      outputDiv.innerText = "Error: " + error.message;
    }
  }

  // ---------- saved transcripts ----------
  const TRANSCRIPTS_KEY = 'savedTranscripts';
  const SCRIPTS_KEY = 'savedScripts';

  function loadTranscripts() {
    try { return JSON.parse(localStorage.getItem(TRANSCRIPTS_KEY) || '[]'); } catch (e) { return []; }
  }

  function persistTranscripts(list) {
    try { localStorage.setItem(TRANSCRIPTS_KEY, JSON.stringify(list)); } catch (e) {}
  }

  function mkMiniBtn(label, handler, danger) {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'mini-btn' + (danger ? ' danger' : '');
    b.textContent = label;
    b.onclick = handler;
    return b;
  }

  function renderSavedTranscripts() {
    const grid = document.getElementById('savedGrid');
    grid.innerHTML = '';

    const addCard = document.createElement('button');
    addCard.type = 'button';
    addCard.className = 'add-card';
    addCard.setAttribute('aria-label', 'Save current transcript');
    addCard.textContent = '+';
    addCard.onclick = saveCurrentTranscript;
    grid.appendChild(addCard);

    loadTranscripts().slice().reverse().forEach(function (item) {
      const card = document.createElement('div');
      card.className = 'mini-card';

      const title = document.createElement('div');
      title.className = 'mini-title';
      title.textContent = item.title;

      const preview = document.createElement('div');
      preview.className = 'mini-preview';
      preview.textContent = item.text.length > 140 ? item.text.slice(0, 140) + '…' : item.text;

      const actions = document.createElement('div');
      actions.className = 'mini-actions';
      actions.appendChild(mkMiniBtn('Load', function () {
        document.getElementById('output').innerText = item.text;
      }));
      actions.appendChild(mkMiniBtn('→ Scripts', function () { importToScripts(item); }));
      actions.appendChild(mkMiniBtn('→ Jebai', function () { importToJebai(item); }));
      actions.appendChild(mkMiniBtn('Delete', function () { deleteTranscript(item.id); }, true));

      card.appendChild(title);
      card.appendChild(preview);
      card.appendChild(actions);
      grid.appendChild(card);
    });
  }

  function saveCurrentTranscript() {
    const outputDiv = document.getElementById('output');
    const text = outputDiv.innerText.trim();
    if (!text || text === 'Your transcript will appear here...' || text.startsWith('Error:') || text.startsWith('Connecting to')) {
      alert('Fetch a transcript first before saving it.');
      return;
    }
    const fallback = 'Transcript ' + new Date().toLocaleString();
    const title = prompt('Name this saved transcript:', document.getElementById('videoUrl').value.trim() || fallback) || fallback;
    const list = loadTranscripts();
    list.push({ id: Date.now().toString(36), title: title, text: text, date: new Date().toISOString() });
    persistTranscripts(list);
    renderSavedTranscripts();
  }

  function deleteTranscript(id) {
    if (!confirm('Delete this saved transcript?')) return;
    persistTranscripts(loadTranscripts().filter(function (i) { return i.id !== id; }));
    renderSavedTranscripts();
  }

  function importToScripts(item) {
    try {
      const scripts = JSON.parse(localStorage.getItem(SCRIPTS_KEY) || '[]');
      scripts.push({ id: Date.now().toString(36), title: item.title, content: item.text, date: new Date().toISOString(), source: 'transcript' });
      localStorage.setItem(SCRIPTS_KEY, JSON.stringify(scripts));
    } catch (e) {}
    if (confirm('Imported to Scripts! Open the Scripts page now?')) {
      window.location.href = '../inventory/scripts.html';
    }
  }

  function importToJebai(item) {
    try {
      localStorage.setItem('jebai_import', JSON.stringify({ type: 'script', title: item.title, text: item.text, source: 'transcript' }));
    } catch (e) {}
    window.location.href = 'ai.html';
  }

  renderSavedTranscripts();
</script>

</body>
</html>
