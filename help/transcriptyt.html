<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instant YouTube Transcript Website</title>
    <style>
        /* Your Custom Branding Palette Integration */
        :root {
            --bg-main: #FF960C;         /* Bright background orange */
            --text-title: #FF7100;      /* Darker heading orange */
            --text-light: #F7F7F7;      /* Clean subtitle / text white */
            --outline-dark: #2E1A00;    /* Deep contrast dark brown */
            --card-bg: #3d2402;         /* Deep container dark background */
        }

        body { 
            font-family: system-ui, -apple-system, sans-serif; 
            max-width: 650px; 
            margin: 0 auto; 
            padding: 40px 20px; 
            color: var(--text-light); 
            background-color: var(--bg-main);
            transition: background-color 0.3s, color 0.3s;
        }

        .header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        h2 {
            color: var(--text-title);
            font-size: 2.2rem;
            margin: 0;
            text-shadow: 2px 2px 0px var(--outline-dark);
        }

        .search-container {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        input { 
            flex: 1;
            padding: 12px; 
            font-size: 16px; 
            border: 2px solid var(--outline-dark); 
            border-radius: 6px; 
            box-sizing: border-box;
            background-color: var(--text-light);
            color: #222;
        }

        .fetch-btn { 
            padding: 12px 20px; 
            font-size: 16px; 
            background-color: var(--text-title); 
            color: var(--text-light); 
            border: 2px solid var(--outline-dark); 
            border-radius: 6px; 
            cursor: pointer; 
            font-weight: bold; 
            text-shadow: 1px 1px 0px var(--outline-dark);
            box-shadow: 3px 3px 0px var(--outline-dark);
        }
        .fetch-btn:hover { background-color: #e66600; }
        .fetch-btn:active { transform: translate(1px, 1px); box-shadow: 2px 2px 0px var(--outline-dark); }

        .action-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 25px;
            margin-bottom: 5px;
        }

        .copy-btn {
            padding: 8px 14px;
            font-size: 14px;
            background-color: transparent;
            color: var(--text-light);
            border: 2px solid var(--outline-dark);
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            background: rgba(0,0,0,0.15);
            box-shadow: 2px 2px 0px var(--outline-dark);
        }
        .copy-btn:hover { background: rgba(0,0,0,0.25); }

        #output { 
            white-space: pre-wrap; 
            background: var(--card-bg); 
            padding: 20px; 
            border-radius: 8px; 
            border: 3px solid var(--outline-dark); 
            min-height: 120px; 
            line-height: 1.6; 
            box-shadow: 5px 5px 0px var(--outline-dark); 
            font-size: 15px;
            color: var(--text-light);
        }

        .nav-back {
            display: inline-block;
            margin-bottom: 15px;
            text-decoration: none;
            color: var(--text-light);
            font-weight: bold;
            border: 2px solid var(--outline-dark);
            padding: 5px 12px;
            border-radius: 6px;
            background: rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

    <!-- Navigates accurately back up to your index index.html page -->
    <a href="../index.html" class="nav-back">← Back to Station Index</a>

    <div class="header-row">
        <h2>My YouTube Transcript Tool</h2>
    </div>
    <p style="margin-top: 0; color: var(--text-light); opacity: 0.9;">Extract video text tracks cleanly using your free Supadata account.</p>
    
    <div class="search-container">
        <input type="text" id="videoUrl" placeholder="Paste YouTube link here (e.g., https://youtube.com...)">
        <button class="fetch-btn" onclick="getTranscript()">Fetch Text</button>
    </div>
    
    <div class="action-row">
        <h3 style="margin: 0; color: var(--text-light);">Transcript Output:</h3>
        <button class="copy-btn" onclick="copyToClipboard()">📋 Copy Text</button>
    </div>
    
    <div id="output">Your transcript will appear here...</div>

    <script>
        // Your integrated Supadata API Key
        const MY_SUPADATA_KEY = "sd_131232fbc0989acf458c7606ff1a9ee6";

        function copyToClipboard() {
            const outputText = document.getElementById('output').innerText;
            if (outputText === "Your transcript will appear here..." || outputText.trim() === "" || outputText.startsWith("Error:")) {
                alert("There is no valid transcript text to copy yet!");
                return;
            }
            
            navigator.clipboard.writeText(outputText).then(() => {
                alert("Transcript copied to clipboard successfully!");
            }).catch(err => {
                alert("Oops, unable to copy text automatically.");
            });
        }

        function cleanSoundTags(text) {
            if (!text) return "";
            // Matches elements nested inside brackets like [music] or (laughter)
            let clean = text.replace(/\[.*?\]|\(.*?\)/gi, "");
            return clean.replace(/\s+/g, " ").trim();
        }

        async function getTranscript() {
            const urlInput = document.getElementById('videoUrl').value.trim();
            const outputDiv = document.getElementById('output');
            
            if (!urlInput) {
                alert('Please paste a YouTube URL first.');
                return;
            }
            
            outputDiv.innerText = "Connecting to Supadata engines and processing captions...";

            // CRITICAL SYSTEM FIX: Correct API route parameters mapped cleanly
            const targetUrl = 'https://supadata.ai' + encodeURIComponent(urlInput) + '&text=true';

            try {
                const response = await fetch(targetUrl, {
                    method: 'GET',
                    headers: {
                        'x-api-key': MY_SUPADATA_KEY
                    }
                });

                if (!response.ok) {
                    throw new Error("Unable to grab transcript. Please verify the URL link or check your free credit limits.");
                }

                const data = await response.json();
                let rawTranscript = "";
                
                // Parse out payloads safely based on structural response conditions
                if (data.content && typeof data.content === 'string') {
                    rawTranscript = data.content;
                } else if (Array.isArray(data.content)) {
                    rawTranscript = data.content.map(function(item) { return item.text; }).join(' ');
                } else if (data.transcript) {
                    rawTranscript = data.transcript;
                } else {
                    outputDiv.innerText = "No readable text track found inside this video's payload.";
                    return;
                }

                // Filter out the music and sound elements before writing to view matrix
                outputDiv.innerText = cleanSoundTags(rawTranscript);

            } catch (error) {
                outputDiv.innerText = "Error: " + error.message;
            }
        }
    </script>
</body>
</html>
