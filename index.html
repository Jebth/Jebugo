<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Directory</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  @font-face {
    font-family: 'Pixel Purl';
    src: url('webfiles/Pixelpurl-0vBPP.ttf') format('truetype');
    font-display: swap;
  }

  @font-face {
    font-family: 'Minecraft';
    src: url('webfiles/MinecraftRegular-Bmg3.otf') format('opentype');
    font-display: swap;
  }

  :root {
    --bg: #FF960C;
    --title: #FF7100;
    --text: #F7F7F7;
    --line: #2E1A00;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Minecraft', 'IBM Plex Mono', monospace;
  }

  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 72px 24px 48px;
  }

  header {
    width: 100%;
    max-width: 760px;
    margin-bottom: 56px;
  }

  h1 {
    font-family: 'Pixel Purl', 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: clamp(2.4rem, 6vw, 3.6rem);
    color: var(--text);
    margin: 0 0 10px;
    letter-spacing: -0.01em;
  }

  header p {
    margin: 0;
    color: var(--text);
    font-size: 0.95rem;
    max-width: 46ch;
    line-height: 1.6;
    opacity: 0.92;
  }

  main {
    width: 100%;
    max-width: 760px;
    display: flex;
    flex-direction: column;
    gap: 40px;
  }

  .folder {
    border: 1px solid var(--line);
    border-radius: 20px;
    overflow: hidden;
  }

  .folder-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    padding: 18px 22px;
    border-bottom: 1px solid var(--line);
    background: var(--title);
  }

  .folder-head h2 {
    font-family: 'Pixel Purl', 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 1.3rem;
    color: var(--text);
    margin: 0;
  }

  .folder-head span {
    font-size: 0.78rem;
    color: var(--text);
    opacity: 0.8;
  }

  .tree {
    padding: 14px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 11px 18px;
    text-decoration: none;
    color: var(--text);
    font-size: 0.92rem;
    background: var(--title);
    border: 1px solid var(--line);
    border-radius: 14px;
    transition: background 0.15s ease, padding-left 0.15s ease;
  }

  .row:hover {
    background: #E06800;
    padding-left: 22px;
  }

  .row .glyph {
    color: var(--line);
    opacity: 0.85;
    font-size: 0.9rem;
    flex-shrink: 0;
  }

  .row.nested {
    margin-left: 28px;
  }

  .row.nested:hover {
    padding-left: 22px;
  }

  .row .name {
    flex: 1;
  }

  .row .go {
    opacity: 0;
    color: var(--line);
    transition: opacity 0.15s ease;
  }

  .row:hover .go {
    opacity: 0.8;
  }

  @media (max-width: 480px) {
    body { padding: 48px 16px 40px; }
    .row.nested { margin-left: 16px; }
    .folder-head { flex-direction: column; align-items: flex-start; gap: 4px; }
  }
</style>
</head>
<body>

<header>
  <h1>Directory</h1>
  <p>Jebugo’s Workplace.<br>Explore &amp; jump straight into it.</p>
</header>

<main>

  <section class="folder">
    <div class="folder-head">
      <h2>guidelines</h2>
      <span>/guidelines</span>
    </div>
    <nav class="tree">
      <a class="row" href="guidelines/fonts.html">
        <span class="glyph">├─</span>
        <span class="name">fonts</span>
        <span class="go">❯❯❯❯</span>
      </a>
      <a class="row" href="guidelines/process.html">
        <span class="glyph">└─</span>
        <span class="name">process</span>
        <span class="go">❯❯❯❯</span>
      </a>
    </nav>
  </section>

  <section class="folder">
    <div class="folder-head">
      <h2>help</h2>
      <span>/help</span>
    </div>
    <nav class="tree">
      <a class="row" href="help/ai.html">
        <span class="glyph">├─</span>
        <span class="name">ai</span>
        <span class="go">❯❯❯❯</span>
      </a>
      <a class="row" href="help/transcriptyt.html">
        <span class="glyph">└─</span>
        <span class="name">transcriptyt</span>
        <span class="go">❯❯❯❯</span>
      </a>
    </nav>
  </section>

  <section class="folder">
    <div class="folder-head">
      <h2>inventory</h2>
      <span>/inventory</span>
    </div>
    <nav class="tree">
      <a class="row" href="inventory/archived.html">
        <span class="glyph">├─</span>
        <span class="name">archived</span>
        <span class="go">❯❯❯❯</span>
      </a>
      <a class="row" href="inventory/ideas.html">
        <span class="glyph">├─</span>
        <span class="name">ideas</span>
        <span class="go">❯❯❯❯</span>
      </a>
      <a class="row" href="inventory/scripts.html">
        <span class="glyph">└─</span>
        <span class="name">scripts</span>
        <span class="go">❯❯❯❯</span>
      </a>
    </nav>
  </section>

</main>

</body>
</html>
