<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Home base</title>
<meta name="description" content="Guidelines, help, and inventory, organized in one place.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  :root{
    --bg:#FF960C;
    --title:#FF7100;
    --text:#F7F7F7;
    --ink:#2E1A00;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    overflow-x:hidden;
    display:flex;
    flex-direction:column;
  }

  /* soft ambient glow behind the hero - the one bit of continuous motion */
  .glow{
    position:fixed;
    top:-180px; left:-160px;
    width:520px; height:520px;
    background:radial-gradient(circle, rgba(247,247,247,.4), transparent 70%);
    filter:blur(8px);
    pointer-events:none;
    z-index:0;
    animation:drift 24s ease-in-out infinite alternate;
  }
  @keyframes drift{
    from{ transform:translate(0,0); }
    to{ transform:translate(36px,28px); }
  }

  main{
    position:relative;
    z-index:1;
    flex:1;
    width:100%;
    max-width:720px;
    margin:0 auto;
    padding:clamp(48px,9vw,96px) 28px 72px;
  }

  /* the one bold moment on the page */
  .hero{
    background:linear-gradient(135deg, #2E1A00, #221300);
    border-radius:20px;
    padding:clamp(28px,5vw,44px) clamp(24px,5vw,40px);
    opacity:0;
    transform:translateY(14px) scale(.98);
    animation:settle .7s cubic-bezier(.22,.61,.36,1) forwards;
  }
  @keyframes settle{
    to{ opacity:1; transform:translateY(0) scale(1); }
  }
  .hero h1{
    font-family:'Bricolage Grotesque',sans-serif;
    font-weight:700;
    font-size:clamp(2.3rem,7vw,3.5rem);
    line-height:1.05;
    letter-spacing:-0.01em;
    color:var(--title);
    margin:0 0 14px;
  }
  .hero p{
    font-size:1.05rem;
    line-height:1.55;
    color:var(--text);
    max-width:44ch;
    margin:0;
  }

  .sections{
    margin-top:clamp(48px,8vw,72px);
    display:flex;
    flex-direction:column;
    gap:clamp(36px,6vw,52px);
  }
  .section h2{
    display:inline-block;
    font-family:'Bricolage Grotesque',sans-serif;
    font-weight:600;
    font-size:1.3rem;
    color:var(--title);
    background:var(--ink);
    border-radius:8px;
    padding:5px 14px;
    margin:0 0 16px;
  }
  .links{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
  }
  /* buttons read like stamped tickets: outlined, ink-on-orange, fill in on interaction */
  .links a{
    font-family:'Inter',sans-serif;
    font-weight:500;
    font-size:.95rem;
    color:var(--ink);
    text-decoration:none;
    background:transparent;
    border:2px solid var(--ink);
    border-radius:8px;
    padding:9px 18px;
    transition:background .2s ease, color .2s ease;
  }
  .links a:hover,
  .links a:focus-visible{
    background:var(--ink);
    color:var(--text);
    outline:none;
  }

  footer{
    position:relative;
    z-index:1;
    background:var(--ink);
    color:var(--text);
    text-align:center;
    font-size:.8rem;
    padding:18px 24px;
  }

  @media (prefers-reduced-motion: reduce){
    .glow{ animation:none; }
    .hero{ animation:none; opacity:1; transform:none; }
    .links a{ transition:none; }
  }
</style>
</head>
<body>

<div class="glow" aria-hidden="true"></div>

<main>
  <div class="hero">
    <h1>Home base</h1>
    <p>Guidelines, help, and inventory, organized so you can find things fast.</p>
  </div>

  <div class="sections">
    <section class="section">
      <h2>Guidelines</h2>
      <div class="links">
        <a href="guidelines/fonts/">Fonts</a>
        <a href="guidelines/process/">Process</a>
      </div>
    </section>

    <section class="section">
      <h2>Help</h2>
      <div class="links">
        <a href="help/ai/">AI</a>
        <a href="help/transcriptyt/">Transcript</a>
      </div>
    </section>

    <section class="section">
      <h2>Inventory</h2>
      <div class="links">
        <a href="inventory/archived/">Archived</a>
        <a href="inventory/ideas/">Ideas</a>
        <a href="inventory/scripts/">Scripts</a>
      </div>
    </section>
  </div>
</main>

<footer>
  This page is just index.html. Edit the links anytime.
</footer>

</body>
</html>
