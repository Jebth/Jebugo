<!DOCTYPE html>
<html lang="en" data-theme="normal">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Archive</title>
<script>
  (function () {
    try {
      var savedTheme = localStorage.getItem('theme');
      if (savedTheme) {
        document.documentElement.setAttribute('data-theme', savedTheme);
      }
    } catch (e) {}
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  @font-face { font-family: 'Minecraft Bold'; src: url('../webfiles/MinecraftBold-nMK1.otf') format('opentype'); font-display: swap; }
  @font-face { font-family: 'Minecraft'; src: url('../webfiles/MinecraftRegular-Bmg3.otf') format('opentype'); font-display: swap; }

  :root {
    --bg: #FF960C; --title: #FF7100; --text: #F7F7F7; --line: #2E1A00; --card-bg: #3d2402;
    --shadow: 0 2px 10px rgba(46, 26, 0, 0.18); --shadow-hover: 0 10px 28px rgba(46, 26, 0, 0.4);
  }
  html[data-theme="dark"] {
    --bg: #121212; --title: #1e1e1e; --text: #f0f0f0; --line: #000000; --card-bg: #1a1a1a;
    --shadow: 0 2px 10px rgba(255, 255, 255, 0.18); --shadow-hover: 0 10px 28px rgba(255, 255, 255, 0.4);
  }
  html[data-theme="light"] {
    --bg: #f5f5f5; --title: #ffffff; --text: #222222; --line: #cfcfcf; --card-bg: #ffffff;
    --shadow: 0 2px 10px rgba(46, 26, 0, 0.18); --shadow-hover: 0 10px 28px rgba(46, 26, 0, 0.4);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); font-family: 'Minecraft', 'IBM Plex Mono', monospace; transition: background 0.2s ease, color 0.2s ease; }
  html { scrollbar-width: thin; scrollbar-color: var(--line) var(--bg); }
  ::-webkit-scrollbar { width: 12px; } ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--line); border-radius: 8px; border: 3px solid var(--bg); }
  ::-webkit-scrollbar-thumb:hover { background: var(--title); }

  body { min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 72px 24px 48px; }
  main { width: 100%; max-width: 700px; display: flex; flex-direction: column; gap: 24px; }

  .nav-back { display: inline-flex; align-items: center; gap: 8px; text-decoration: none; color: var(--text); font-size: 0.85rem; border: 1px solid var(--line); padding: 9px 16px; border-radius: 5px; background: var(--title); transition: background 0.15s ease, padding-left 0.15s ease; align-self: flex-start; }
  .nav-back:hover { background: #E06800; padding-left: 20px; }

  .folder { position: relative; border: 1px solid var(--line); border-radius: 5px; box-shadow: var(--shadow); transition: box-shadow 0.2s ease; }
  .folder:hover, .folder:focus-within { box-shadow: var(--shadow-hover); }
  .folder-head { padding: 18px 22px; border-bottom: 1px solid var(--line); background: var(--title); border-radius: 5px 5px 0 0; }
  .folder-head h1 { font-family: 'Minecraft Bold', 'Space Grotesk', sans-serif; font-weight: 700; font-size: 1.4rem; color: var(--text); margin: 0 0 6px; }
  .folder-head p { margin: 0; color: var(--text); font-size: 0.85rem; opacity: 0.85; line-height: 1.5; }
  .folder-body { padding: 22px; display: flex; flex-direction: column; gap: 16px; }

  .btn { padding: 11px 18px; font-size: 0.82rem; font-family: 'Minecraft', 'IBM Plex Mono', monospace; background: rgba(0,0,0,0.15); color: var(--text); border: 1px solid var(--line); border-radius: 5px; cursor: pointer; font-weight: bold; white-space: nowrap; transition: background 0.15s ease; }
  .btn:hover { background: rgba(0,0,0,0.28); }
  .btn.primary { background: var(--title); }
  .btn.primary:hover { background: #E06800; }

  .tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 10px;
  }
  .tab-btn {
    flex: 1;
    padding: 10px 12px solid var(--line);
    border-radius: 5px 5px 0 0;
    background: rgba(0,0,0,0.08);
    color: var(--text);
    cursor: pointer;
    font-family: 'Minecraft', monospace;
    font-size: 0.85rem;
    border-bottom: 3px solid transparent;
 0.15s ease;
  }
  .tab-btn.active {
    background: var(--title);
    border-bottom-color: var(--line: var(--line);
  }
  .tab-btn:hover:not: rgba(0,0,0,0.15); }

  .archive-card-bg);
    border: var(--card-bg);
    border: 1px solid var(--line);
    border-radius: 5px;
    padding: 14px;
    display: flex;
  }
  .archive-item .h-meta { font-size: 0.68rem; opacity: 0.7; margin-bottom: 6px; }
  .archive-item .preview { white-space: pre-wrap;
    font-size: 0.8rem; line-height: 1.5;
    margin-bottom: 8px;
    max-height: 240;
    display:  168px;
  }

  .mini-btn { font-size: 0.72rem; padding: 6px 10px;
    border: var(--line);
    background: rgba(0,0,0,0.15);
    color: var(--text);
    cursor: pointer;
    font-family: 'Minecraft', 'IBM Plex Mono', monospace;
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .mini-btn:hover { background: rgba(0,0,0,0.28); }
  .mini-btn.danger { border-color: #ffb4b4; color: #ffb4b4; }
  .mini-btn.danger:hover { background: rgba(255,100,100,0.2); }

  .empty-state { text-align: center; padding: 30px 0.7; font-size: 0.7;
  }

  @media (max-width:
    body { padding: 48px 16px 40px; }
  }
</style>
</head>
<body>

<main>
  <a href="../index.html" class="nav-back">← Back to Directory</a>

  <section class="folder">
    <div class="folder-head">
      <h1>Archive</h1>
      <p>Browse your archived ideas and scripts. You can view, restore, or delete old content that
    <div class="folder-body">
      <div class="tabs">
        <button class="tab-btn active" id="tabIdeas" onclick="switchTab('ideas')">💡 Archived Ideas</button>
        <button class="tab-btn" id="tabScripts" onclick="switchTab('scripts')">📜 Scripts</button>
      </div>
      <div id="tabContent">
        <div id="itemsList" class="archive-list"></div>
        <div class="empty-state" id="empty">No archived items yet.</div>
      </div>
    </div>
    </div>
  </section>
</main>

<script>
  const IDEAS_KEY = 'savedIdeas';
  const SCRIPTS_KEY = 'savedScripts';
  let currentTab = 'ideas'; let ideas = [];
  let scripts = [];

  function load() {
    try {
      ideas = JSON.parse(localStorage.getItem(IDEAS_KEY) || '[]');
    } catch (e) { ideas = []; }
    try {
      scripts = JSON.parse(localStorage.getItem(SCRIPTS_KEY) || '[]');
    } catch (e) { scripts = []; }
  }

  function saveIdeaData() {
    try {
      localStorage.setItem(IDEAS_KEY, JSON.stringify(ideas));
    } catch (e) {}
  }

  function saveScriptData() {
    try {
      localStorage.setItem(SCRIPTS_KEY, JSON.stringify(scripts));
    } catch (e) {}
  }

  function escapeHtml(text) {
    if (!text) return '';
    return String(text).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function switchTab(tab) {
    currentTab = tab;
    document.getElementById('tabIdeas').classList.toggle('active', tab === 'ideas');
    document.getElementById('tabScripts').classList.toggle('active', tab === 'scripts');
    render();
  }

  function render() {
    const listEl = document.getElementById('archiveList');
    const emptyEl = document.getElementById('archiveEmpty');
    listEl.innerHTML = '';

    const items = currentTab === 'ideas' ? ideas : scripts;
    const titleField = currentTab === 'ideas' ? 'text' : 'title';

    if (!items.length) {
      emptyEl.style.display = 'block';
      emptyEl.textContent = currentTab === 'ideas' ? 'No archived ideas yet.' : 'No archived scripts yet.';
      return;
    }
    emptyEl.style.display = 'none';

    items.slice().reverse().forEach(function (item) {
      const el = document.createElement('div');
      el.className = 'archive-item';
      const preview = item.text || item.content || '';
      el.innerHTML = `
        <div class="h-meta">${escapeHtml(new Date(item.date).toLocaleString())}</div>
        <div class="h-title">${escapeHtml(item.title || 'Untitled')}</div>
        <div class="h-text">${escapeHtml(preview.slice(0, 200))}${preview.length > 200 ? '...' : ''}</div>
        <div class="card-actions">
          <button class="mini-btn" onclick="viewFull('${item.id}')">👁 View</button>
          <button class="mini-btn danger" onclick="deleteItem('${item.id}')">✕ Delete</button>
        </div>
      `;
      listEl.appendChild(el);
    });
  }

  function viewFull(id) {
    const items = currentTab === 'ideas' ? ideas : scripts;
    const item = items.find(function (i) { return i.id === id; });
    if (!item) return;
    const content = item.text || item.content || '';
    alert((item.title ? item.title + '\n\n' : '') + content);
  }

  function deleteItem(id) {
    if (!confirm('Permanently delete this item?')) return;
    if (currentTab === 'ideas') {
      ideas = ideas.filter(function (i) { return i.id !== id; });
      saveIdeaData();
    } else {
      scripts = scripts.filter(function (s) { return s.id !== id; });
      saveScriptData();
    }
    render();
  }

  // init
  loadData();
  render();
</script>

</body>
</html>
